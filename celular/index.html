<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halcon Pruebas</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
    button { font-size: 18px; padding: 14px; margin: 6px 0; width: 100%; }
    #estado { margin: 12px 0; font-size: 18px; white-space: pre-wrap; }
    #error { color: #b00020; }
    .oculto { display: none; }
    /* La cámara se dibuja detrás de la página: mientras escanea, el fondo tiene que ser transparente. */
    html.escaneando, body.escaneando { background: transparent; }
    body.escaneando #vincular { display: none; }
    body.escaneando #panel { background: rgba(255, 255, 255, 0.85); padding: 8px; }
  </style>
</head>
<body>
  <div id="vincular">
    <h1>Halcon Pruebas</h1>
    <button id="btn-vincular">Vincular con el notebook (escanear QR)</button>
    <button id="btn-olvidar">Olvidar notebook</button>
    <div id="estado"></div>
  </div>
  <div id="panel">
    <button id="btn-escanear">Escanear productos</button>
    <button id="btn-parar" class="oculto">Parar</button>
    <div id="datos"></div>
    <div id="error"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
